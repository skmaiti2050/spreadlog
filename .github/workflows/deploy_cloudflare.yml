name: Deploy Web to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a running deploy finish; a newer push queues behind it.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync Web Assets
        run: dart run tool/update_web_assets.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Drift Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # The drawer shows this next to the app version.
      - name: Build Flutter Web Release
        run: flutter build web --release --dart-define=BUILD_COMMIT=${GITHUB_SHA::7}

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the wrangler used for local deploys so CI and
          # tool/deploy_cloudflare.ps1 behave the same. (wrangler 3.x
          # rejects this assets-only Worker with "Missing entry-point".)
          wranglerVersion: '4.153.0'
          # The site is a Worker with static assets (wrangler.jsonc), not a
          # Pages project; same command as tool/deploy_cloudflare.ps1.
          command: deploy

