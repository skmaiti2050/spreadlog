name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync Web Assets
        run: dart run tool/update_web_assets.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Drift Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web Release
        run: flutter build web --release

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the wrangler used for local deploys so CI and
          # tool/deploy_cloudflare.ps1 behave the same. (wrangler 3.x
          # rejects this assets-only Worker with "Missing entry-point".)
          wranglerVersion: '4.153.0'
          # The site is a Worker with static assets (wrangler.jsonc), not a
          # Pages project; same command as tool/deploy_cloudflare.ps1.
          command: deploy

